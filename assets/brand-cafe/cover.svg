<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 448" width="840" height="448">
  <!-- «سكّر وهيل» cover: illustrated pattern of coffee cups, croissants and cardamom pods. Original artwork, no photos. -->
  <defs>
    <g id="cup">
      <path d="M-26 -14 L 26 -14 L 22 14 C 20 22, 12 26, 4 26 L -4 26 C -12 26, -20 22, -22 14 Z" fill="#F6EFE6"/>
      <path d="M26 -6 C 42 -8, 42 16, 22 14" fill="none" stroke="#F6EFE6" stroke-width="6" stroke-linecap="round"/>
      <path d="M-8 -24 C -14 -32, -2 -36, -8 -44 M8 -24 C 2 -32, 14 -36, 8 -44" fill="none" stroke="#8BA888" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="croissant">
      <path d="M-40 10 C -30 -24, 30 -24, 40 10 C 26 0, 14 -2, 0 -2 C -14 -2, -26 0, -40 10 Z" fill="#E7C9A0"/>
      <path d="M-20 -10 C -16 -2, -14 2, -14 6 M0 -14 L 0 -2 M20 -10 C 16 -2, 14 2, 14 6" fill="none" stroke="#B8875A" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="pod">
      <path d="M0 -24 C 14 -14, 14 14, 0 24 C -14 14, -14 -14, 0 -24 Z" fill="#8BA888"/>
      <path d="M0 -18 C 5 -6, 5 6, 0 18" fill="none" stroke="#6E8C6B" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bean">
      <ellipse rx="10" ry="14" fill="#4A3228"/>
      <path d="M0 -12 C -4 -4, 4 4, 0 12" fill="none" stroke="#8A6550" stroke-width="2.5"/>
    </g>
  </defs>
  <rect width="840" height="448" fill="#6B4A3A"/>
  <!-- soft dotted texture -->
  <g fill="#F6EFE6" opacity="0.08">
    <circle cx="40" cy="40" r="4"/><circle cx="160" cy="90" r="4"/><circle cx="300" cy="30" r="4"/><circle cx="460" cy="70" r="4"/>
    <circle cx="620" cy="36" r="4"/><circle cx="780" cy="96" r="4"/><circle cx="90" cy="230" r="4"/><circle cx="260" cy="210" r="4"/>
    <circle cx="560" cy="220" r="4"/><circle cx="720" cy="250" r="4"/><circle cx="40" cy="380" r="4"/><circle cx="380" cy="400" r="4"/><circle cx="800" cy="410" r="4"/>
  </g>
  <!-- motifs -->
  <use href="#cup" transform="translate(90 110) rotate(-10)"/>
  <use href="#croissant" transform="translate(250 70) rotate(12)"/>
  <use href="#pod" transform="translate(380 140) rotate(30)"/>
  <use href="#cup" transform="translate(520 90) rotate(8) scale(1.15)"/>
  <use href="#bean" transform="translate(640 160) rotate(-25)"/>
  <use href="#croissant" transform="translate(760 70) rotate(-14) scale(0.9)"/>
  <use href="#pod" transform="translate(190 200) rotate(-40) scale(0.9)"/>
  <use href="#bean" transform="translate(300 250) rotate(20)"/>
  <use href="#croissant" transform="translate(110 320) rotate(-8) scale(1.1)"/>
  <use href="#cup" transform="translate(690 300) rotate(-6)"/>
  <use href="#pod" transform="translate(790 220) rotate(18)"/>
  <use href="#bean" transform="translate(30 170) rotate(40)"/>
  <use href="#bean" transform="translate(560 320) rotate(-30)"/>
  <use href="#pod" transform="translate(600 400) rotate(-20) scale(0.85)"/>
  <use href="#cup" transform="translate(250 380) rotate(10) scale(0.95)"/>
  <use href="#croissant" transform="translate(430 330) rotate(6) scale(0.85)"/>
  <use href="#bean" transform="translate(800 360) rotate(10)"/>
</svg>
