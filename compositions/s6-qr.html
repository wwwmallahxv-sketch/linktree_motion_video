  <script>

      // «بأي حجم» 10.8, «وبدون ما تخرب الجودة» 12.0–13.4, «الزبون بيوجه الكاميرا» 14.3–15.9, «وبثانية بيوصل لصفحتك» 16.9–18.9
      const tl = gsap.timeline({ paused: true });
      const label = (id, at) => tl.fromTo(id, { y: -24, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, at);
      const unlabel = (id, at) => tl.to(id, { y: -16, opacity: 0, duration: 0.16, ease: "power2.in" }, at);
      const show = (id, at) => tl.set(id, { visibility: "visible" }, at);
      const hide = (id, at) => tl.set(id, { visibility: "hidden" }, at);
      // whip between worlds: outgoing smears off one side, incoming lands blurred and sharpens
      const whip = (outId, inId, at, dir) => {
        show(inId, at);
        tl.fromTo(outId, { x: 0, filter: "blur(0px)" }, { x: -dir * 1080, filter: "blur(18px)", duration: 0.28, ease: "power3.in", immediateRender: false }, at);
        tl.fromTo(inId, { x: dir * 1080, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.36, ease: "power3.out", immediateRender: false }, at + 0.12);
        hide(outId, at + 0.42);
      };
      // table framing: tent QR centre (540,1004 in the world) lands on (504, cy) at scale s
      const tableView = (s, cy) => ({ x: 504 - 540 * s, y: cy - 1004 * s, scale: s });

      tl.set("#s6-cardwrap", { transformOrigin: "504px 800px" }, 0);
