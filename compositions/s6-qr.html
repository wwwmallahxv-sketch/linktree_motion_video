    <div id="s6-l2c" class="s6-label clip" data-start="7.0" data-duration="3.0" data-track-index="3"><div id="s6-l2" class="p"><i class="ico i-qrcode"></i>على باب المحل</div></div>
    <div id="s6-l3c" class="s6-label clip" data-start="10.0" data-duration="3.0" data-track-index="3"><div id="s6-l3" class="p"><i class="ico i-qrcode"></i>على المنيو</div></div>
    <div id="s6-l4c" class="s6-label clip" data-start="13.0" data-duration="2.5" data-track-index="3"><div id="s6-l4" class="p"><i class="ico i-qrcode"></i>على كرت الزيارة</div></div>
    <div id="s6-l5c" class="s6-label clip" data-start="15.5" data-duration="2.3" data-track-index="3"><div id="s6-l5" class="p"><i class="ico i-qrcode"></i>على الأكياس</div></div>
    <div id="s6-l6c" class="s6-label clip" data-start="17.9" data-duration="2.0" data-track-index="3"><div id="s6-l6" class="p">بأي حجم… بنفس الجودة</div></div>
    <div id="s6-l7c" class="s6-label clip" data-start="20.0" data-duration="3.0" data-track-index="3"><div id="s6-l7" class="p"><i class="ico i-circle-check"></i>وجّه الكاميرا… ووصلت</div></div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const label = (id, at) => tl.fromTo(id, { y: -30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, at);
      const unlabel = (id, at) => tl.to(id, { y: -20, opacity: 0, duration: 0.2, ease: "power2.in" }, at);
      const show = (id, at) => tl.set(id, { visibility: "visible" }, at);
      const hide = (id, at) => tl.set(id, { visibility: "hidden" }, at);
      // whip between worlds: outgoing smears off one side, incoming lands blurred and sharpens
      const whip = (outId, inId, at, dir) => {
        show(inId, at);
        tl.fromTo(outId, { x: 0, filter: "blur(0px)" }, { x: -dir * 1080, filter: "blur(18px)", duration: 0.32, ease: "power3.in", immediateRender: false }, at);
        tl.fromTo(inId, { x: dir * 1080, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out", immediateRender: false }, at + 0.14);
        hide(outId, at + 0.47);
      };

      // all worlds start hidden except A

      // A) QR draws itself: finders, then modules ripple outward
      tl.fromTo("#s6-card", { scale: 0.6, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, 0.0);
      tl.fromTo("#s6-card .qf", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: { amount: 0.5 } }, 0.35);
      tl.fromTo("#s6-card .qm", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)", stagger: { amount: 1.3 } }, 0.8);
      tl.fromTo("#s6-h .w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.09 }, 0.35);
      tl.fromTo("#s6-scan-line", { y: 0, opacity: 0 }, { y: 600, opacity: 1, duration: 0.7, ease: "power1.inOut" }, 2.25);
      tl.to("#s6-scan-line", { opacity: 0, duration: 0.15 }, 2.95);
      tl.fromTo("#s6-cardlink", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.7);
      tl.to("#s6-h .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", stagger: 0.04 }, 3.05);
      tl.to("#s6-cardlink", { opacity: 0, duration: 0.2 }, 3.1);

      // A → B: the QR card flies onto the table tent (carry across), the table fades up around it
      show("#s6-b", 3.2);
      tl.fromTo("#s6-b", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut" }, 3.3);
      tl.to("#s6-cardwrap", { x: 0, y: 44, scale: 0.47, duration: 0.6, ease: "power3.inOut" }, 3.2);
      tl.to("#s6-a", { opacity: 0, duration: 0.25 }, 3.65);
      hide("#s6-a", 3.95);
      tl.fromTo("#s6-b-cam", { scale: 1.3, transformOrigin: "50% 55%" }, { scale: 1.12, duration: 3.2, ease: "power2.out" }, 3.3);
      label("#s6-l1", 3.95);
      unlabel("#s6-l1", 6.7);

      // B → C whip to the glass door
      whip("#s6-b", "#s6-c", 6.75, 1);
      tl.fromTo("#s6-streak", { x: 0 }, { x: 1700, duration: 2.4, ease: "power1.inOut" }, 7.2);
      tl.fromTo("#s6-sticker", { scale: 0.9, rotation: -8 }, { scale: 1, rotation: -3, duration: 2.8, ease: "power2.out" }, 7.0);
      label("#s6-l2", 7.1);
      unlabel("#s6-l2", 9.75);

      // C → D: menu slides up into frame over a dip cut
      tl.to("#s6-c", { opacity: 0.6, duration: 0.1 }, 9.8);
      show("#s6-d", 9.9);
      hide("#s6-c", 9.9);
      tl.fromTo("#s6-menu-wrap", { y: 900, rotation: 8 }, { y: 0, rotation: 0, duration: 0.75, ease: "expo.out" }, 9.9);
      tl.fromTo("#s6-menu", { rotateX: 22, rotateZ: -5 }, { rotateX: 14, rotateZ: -3, duration: 3.0, ease: "power1.out" }, 9.9);
      label("#s6-l3", 10.1);
      unlabel("#s6-l3", 12.75);

      // D → E whip to business cards
      whip("#s6-d", "#s6-e", 12.8, -1);
      tl.fromTo("#s6-bc1", { y: -500, rotation: -10 }, { y: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, 12.95);
      tl.fromTo("#s6-bc2", { y: 700, rotation: 10 }, { y: 0, rotation: 0, duration: 0.85, ease: "expo.out" }, 13.1);
      tl.fromTo("#s6-bc2", { scale: 1 }, { scale: 1.05, duration: 1.6, ease: "power1.out", immediateRender: false }, 13.9);
      label("#s6-l4", 13.1);
      unlabel("#s6-l4", 15.25);

      // E → F whip to the takeaway bag
      whip("#s6-e", "#s6-f", 15.3, 1);
      tl.fromTo("#s6-bag", { y: -300, rotation: -4 }, { y: 0, rotation: 0, duration: 0.7, ease: "bounce.out" }, 15.4);
      tl.fromTo("#s6-bag-shadow", { scaleX: 0.5, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.out" }, 15.4);
      tl.fromTo("#s6-bag", { scale: 1 }, { scale: 1.06, duration: 1.7, ease: "power1.out", immediateRender: false }, 16.1);
      label("#s6-l5", 15.6);
      unlabel("#s6-l5", 17.55);

      // G) any size: the vector QR comes back small and zooms until single modules fill the frame
